<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cases - NYAYA-SAHAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app" id="app">
    <aside id="sidebar"></aside>
    <main class="main-content" id="main-content">
      <header id="header"></header>
      <div class="page-content" id="page-content">
        <div class="page-header">
          <h2>Active Investigation Cases</h2>
          <div class="page-actions flex gap-2">
            <button class="btn btn-secondary flex items-center gap-2" onclick="window.location.href='tracking-pipeline.html'">📍 Case Tracking Pipeline</button>
            <button class="btn btn-primary" id="btn-create-case">+ Create New Case</button>
          </div>
        </div>
        
        <div class="filter-bar flex gap-3 mb-4">
          <div class="search-filter input-with-icon" style="flex: 1;">
            <span class="icon"></span>
            <input type="text" id="search-input" class="form-input w-full" placeholder="Search cases by ID or title...">
          </div>
          <select id="type-filter" class="form-select">
            <option value="All Types">All Types</option>
            <option value="Criminal">Criminal</option>
            <option value="Civil">Civil</option>
            <option value="Financial Crime">Financial Crime</option>
            <option value="Property">Property</option>
          </select>
          <select id="status-filter" class="form-select">
            <option value="All Status">All Status</option>
            <option value="Active">Active</option>
            <option value="Under Investigation">Under Investigation</option>
            <option value="Pending">Pending</option>
            <option value="Closed">Closed</option>
          </select>
          <select id="sort-filter" class="form-select">
            <option value="Last Updated">Last Updated</option>
            <option value="Case ID">Case ID</option>
            <option value="Title">Title</option>
          </select>
        </div>
        
        <div class="mt-4" id="cases-table-container">
          
        </div>
      </div>
    </main>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="js/mock-data.js"></script>
  <script src="js/services/apiClient.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cases.js"></script>
</body>
</html>
