<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - NYAYA-SAHAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app" id="app">
    <aside id="sidebar"></aside>
    <main class="main-content" id="main-content">
      <header id="header"></header>
      <div class="page-content" id="page-content">
        
        <div class="page-header">
          <h1 class="page-title">
            <span class="icon" id="page-icon"></span>
            Reports
          </h1>
        </div>

        <div class="grid grid-4 mb-4">
          <div class="card report-card card-clickable active" data-report="case">
            <div class="card-body">
              <div class="report-card-icon" style="background-color: rgba(0, 102, 204, 0.1); color: #0066cc; padding: 12px; border-radius: 8px; display: inline-block; margin-bottom: 12px;">
                <span class="icon" id="icon-case-report"></span>
              </div>
              <h3 class="mt-2">Case Report</h3>
              <p class="text-muted mt-2">Comprehensive case status and progress overview</p>
            </div>
          </div>
          
          <div class="card report-card card-clickable" data-report="document">
            <div class="card-body">
              <div class="report-card-icon" style="background-color: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 12px; border-radius: 8px; display: inline-block; margin-bottom: 12px;">
                <span class="icon" id="icon-doc-report"></span>
              </div>
              <h3 class="mt-2">Document Report</h3>
              <p class="text-muted mt-2">Document repository analysis and statistics</p>
            </div>
          </div>

          <div class="card report-card card-clickable" data-report="activity">
            <div class="card-body">
              <div class="report-card-icon" style="background-color: rgba(245, 158, 11, 0.1); color: #f59e0b; padding: 12px; border-radius: 8px; display: inline-block; margin-bottom: 12px;">
                <span class="icon" id="icon-activity-report"></span>
              </div>
              <h3 class="mt-2">Activity Report</h3>
              <p class="text-muted mt-2">User activity and access patterns</p>
            </div>
          </div>

          <div class="card report-card card-clickable" data-report="integrity">
            <div class="card-body">
              <div class="report-card-icon" style="background-color: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 12px; border-radius: 8px; display: inline-block; margin-bottom: 12px;">
                <span class="icon" id="icon-integrity-report"></span>
              </div>
              <h3 class="mt-2">Integrity Report</h3>
              <p class="text-muted mt-2">Document integrity verification summary</p>
            </div>
          </div>
        </div>

        <div class="page-actions mb-4 flex gap-3">
          <button class="btn btn-primary" id="btn-generate">Generate Report</button>
          <button class="btn btn-secondary" id="btn-export-pdf">
            <span class="icon" id="icon-pdf-export"></span> Export PDF
          </button>
          <button class="btn btn-secondary" id="btn-export-csv">
            <span class="icon" id="icon-csv-export"></span> Export CSV
          </button>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Report Preview</h3>
          </div>
          <div class="card-body" id="report-preview-content">
            
          </div>
        </div>

      </div>
    </main>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
