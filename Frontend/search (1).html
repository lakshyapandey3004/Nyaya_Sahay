<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Search - NYAYA-SAHAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app" id="app">
    <aside id="sidebar"></aside>
    <main class="main-content" id="main-content">
      <header id="header"></header>
      <div class="page-content" id="page-content">
        
        <div class="page-header">
          <div>
            <h1 class="page-title">Smart Search <span class="badge badge-ai"><span class="ai-dot"></span> AI-Powered</span></h1>
            <p class="text-muted">Search across all documents, cases, and extracted entities</p>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <div class="search-large mb-4">
              <span class="search-icon" id="search-icon-placeholder">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </span>
              <input type="text" id="main-search-input" class="form-input" placeholder="Search across all documents using natural language..." autocomplete="off">
              <button class="btn btn-primary" id="search-btn">Search</button>
            </div>
            
            <div class="search-toggle flex items-center justify-center gap-2 mb-2">
              <button class="btn btn-sm search-toggle-btn" id="btn-keyword-mode">Keyword Search</button>
              <button class="btn btn-sm search-toggle-btn active ai-mode" id="btn-semantic-mode">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Semantic Search (AI)
              </button>
            </div>
            <div class="text-center text-muted mb-4 hidden" id="ai-mode-hint" style="font-size:0.8rem;">
              <span class="ai-badge">✦ AI-Powered Semantic Search</span>
            </div>

            <div class="divider"></div>

            <div class="filter-bar grid grid-4 gap-4 mt-4">
              <div class="form-group mb-0">
                <label class="form-label text-sm">Case</label>
                <select id="filter-case" class="form-select">
                  <option value="">All Cases</option>
                </select>
              </div>
              <div class="form-group mb-0">
                <label class="form-label text-sm">Document Type</label>
                <select id="filter-type" class="form-select">
                  <option value="">All Types</option>
                  <option value="FIR">FIR</option>
                  <option value="Affidavit">Affidavit</option>
                  <option value="Evidence">Evidence</option>
                  <option value="Contract">Contract</option>
                  <option value="Statement">Statement</option>
                </select>
              </div>
              <div class="form-group mb-0 flex gap-2">
                <div style="flex:1">
                  <label class="form-label text-sm">From Date</label>
                  <input type="date" id="filter-date-from" class="form-input">
                </div>
                <div style="flex:1">
                  <label class="form-label text-sm">To Date</label>
                  <input type="date" id="filter-date-to" class="form-input">
                </div>
              </div>
              <div class="form-group mb-0">
                <label class="form-label text-sm">Status</label>
                <select id="filter-status" class="form-select">
                  <option value="">All Statuses</option>
                  <option value="verified">Verified</option>
                  <option value="pending">Pending Verification</option>
                  <option value="violated">Integrity Violation</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="search-results-header flex justify-between items-center mb-4">
          <h2 class="section-title mb-0" id="results-count">Search Results (0)</h2>
          <div class="flex gap-2">
            <button class="btn btn-sm btn-outline"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-1"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Export Results</button>
          </div>
        </div>

        <div id="search-results-container" class="flex flex-col gap-3">
          
        </div>

      </div>
    </main>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="js/mock-data.js"></script>
  <script src="js/services/apiClient.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
